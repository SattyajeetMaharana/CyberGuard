model:
  type: xgboost
  objective: binary:logistic
  eval_metric: logloss
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: -1
  tree_method: hist

data:
  train: ml/datasets/malicious_url/processed/train.csv
  validation: ml/datasets/malicious_url/processed/validation.csv
  test: ml/datasets/malicious_url/processed/test.csv
  target_column: label

output:
  model: ml/models/trained/malicious_url/malicious_url_xgboost.json
  metadata: ml/models/metadata/malicious_url_metadata.json

label_mapping:
  "0": malicious
  "1": benign
